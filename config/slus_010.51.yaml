name: SLUS_010.51
sha1: 7db0f45fb65a764b2ec0fc40c9e100e47242103a
options:
  basename: slus_010.51
  target_path: extracted/disc1/SLUS_010.51
  elf_path: build/slus_010.51.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/main
  src_path: src/main
  build_path: build
  ld_script_path: build/linkers/slus_010.51.ld
  symbol_addrs_path:
    - config/symbols/main.txt
    - config/symbols/main_a.txt
    - config/symbols/main_b.txt
    - config/symbols/sound.txt
  undefined_funcs_auto_path: build/linkers/undefined_funcs_auto.main.txt
  undefined_syms_auto_path: build/linkers/undefined_syms_auto.main.txt

  find_file_boundaries: true
  gp_value: 0x800B4BFC
  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  ld_bss_is_noload: true
  use_legacy_include_asm: false
  asm_jtbl_label_macro: jlabel
  create_c_files: true # only creates missing files; never overwrites src/
  auto_decompile_empty_functions: false # keep them INCLUDE_ASM: a .cpp body would mangle the name
  disassemble_all: true # decompiled functions keep a reference .s in asm/<target>/matchings/
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000
  # Retail sections are only word-aligned (.data at 0x800A4514, .sdata at $gp).
  subalign: 4
  ld_align_section_vram_end: false
  ld_align_segment_vram_end: false

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    # BSS really spans 0x800B4EE8..0x800B6DF0 (cleared by the entry point), but splat measures
    # bss_size from the segment's ROM end (0x800B5000, after the zero padding).
    bss_size: 0x1DF0
    subsegments:
      # .ctors / .dtors: one entry per C++ translation unit with static objects. Each entry is that
      # unit's _GLOBAL_$I$/$D$ function, emitted at the end of the unit, so they mark file boundaries.
      - [0x800, rodata, ctors]
      - [0x8C0, .rodata, main_a] # 0x800100C0: main_a's rodata, migrated into its functions
      - [0x4140, .rodata, main_b] # 0x80013940: main_b's rodata (no interleaving with main_a's)
      - [0x874C, .rodata, sound] # 0x80017F4C: the sound driver's rodata (jtbl_80017F4C)
      - [0x8760, rodata, psyq] # 0x80017F60: library rodata ("$Id: sys.c ...")
      # Game code, split at a real file boundary: func_80054A04 is a static constructor, the last
      # function of its file. More splits will follow at the other .ctors boundaries.
      - [0x8EB0, cpp, main_a] # 0x800186B0 -> src/main/main_a.cpp
      - [0x4522C, cpp, main_b] # 0x80054A2C -> src/main/main_b.cpp
      # Sound driver (next to "Programmed by Hidenori Suzuki"): GCC 2.7.2 / PsyQ 4.1, no $gp. It starts after
      # func_8008B630 (the last 4.4-only function) and by 0x8008C4B8 (the first 4.1-only one).
      - [0x7BEB0, cpp, sound] # 0x8008B6B0 -> src/main/sound.cpp
      - [0x85110, asm, psyq] # 0x80094910: PsyQ 4.6 libraries (LoadExec ...), kept as asm
      - [0x94D14, data] # 0x800A4514
      - [0xA53FC, sdata] # 0x800B4BFC = $gp
      - { start: 0xA56E8, type: bss, vram: 0x800B4EE8 }

  - [0xA5800]
