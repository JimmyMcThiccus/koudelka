name: BATTLE.BIN
sha1: d7651888ab475b1e0b3ea40a274e9a225c0948b1
options:
  basename: battle
  target_path: extracted/disc1/BIN/BATTLE.BIN
  elf_path: build/battle.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/battle
  src_path: src/battle
  build_path: build
  ld_script_path: build/linkers/battle.ld
  symbol_addrs_path:
    - config/symbols/main.txt
    - config/symbols/main_a.txt
    - config/symbols/main_a2.txt
    - config/symbols/main_b.txt
    - config/symbols/sound.txt
    - config/symbols/battle.txt
  undefined_funcs_auto_path: build/linkers/undefined_funcs_auto.battle.txt
  undefined_syms_auto_path: build/linkers/undefined_syms_auto.battle.txt

  find_file_boundaries: true
  gp_value: 0x800B4BFC
  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  use_legacy_include_asm: false
  asm_jtbl_label_macro: jlabel
  create_c_files: true # only creates missing files; never overwrites src/
  auto_decompile_empty_functions: false # keep them INCLUDE_ASM: a .cpp body would mangle the name
  disassemble_all: true # decompiled functions keep a reference .s in asm/<target>/matchings/
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  subalign: 4
  ld_align_section_vram_end: false
  ld_align_segment_vram_end: false

segments:
  - name: battle
    type: code
    start: 0x0
    vram: 0x800B6DF0
    subsegments:
      - [0x0, rodata] # overlay id + entry table and data, reached by global symbol
      # Original files, from jump-table alignment (tools/jtbl_classes.py): GCC aligns tables to 8 relative
      # to its object's rodata, so all tables of one file share an address mod 8, and each unit's rodata
      # starts at its first table. battle then battle_b / battle_c (code cut at 0x800C1E44 / 0x800CF764; rodata at 0x800B73BC, 0x800B75C0 / 0x800B7844).
      - [0x5CC, .rodata, battle] # 0x800B73BC
      - [0x7D0, .rodata, battle_b]
      - [0xA54, .rodata, battle_c]
      - [0x120C, cpp, battle]
      - [0xB054, cpp, battle_b]
      - [0x18974, cpp, battle_c]
      - [0x1EF88, data]

  - [0x1EFBC]
