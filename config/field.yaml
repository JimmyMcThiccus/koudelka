name: FIELD.BIN
sha1: 8ce2df53f4a68c64401b9760211b731d2f486270
options:
  basename: field
  target_path: extracted/disc1/BIN/FIELD.BIN
  elf_path: build/field.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/field
  src_path: src/field
  build_path: build
  ld_script_path: build/linkers/field.ld
  symbol_addrs_path:
    - config/symbols/main.txt
    - config/symbols/main_a.txt
    - config/symbols/main_a2.txt
    - config/symbols/main_b.txt
    - config/symbols/sound.txt
    - config/symbols/field.txt
  undefined_funcs_auto_path: build/linkers/undefined_funcs_auto.field.txt
  undefined_syms_auto_path: build/linkers/undefined_syms_auto.field.txt

  find_file_boundaries: true
  gp_value: 0x800B4BFC
  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  use_legacy_include_asm: false
  asm_jtbl_label_macro: jlabel
  create_c_files: true # only creates missing files; never overwrites src/
  auto_decompile_empty_functions: false # keep them INCLUDE_ASM: a .cpp body would mangle the name
  disassemble_all: true # decompiled functions keep a reference .s in asm/<target>/matchings/
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  subalign: 4
  ld_align_section_vram_end: false
  ld_align_segment_vram_end: false

segments:
  - name: field
    type: code
    start: 0x0
    vram: 0x800B6DF0
    subsegments:
      - [0x0, rodata] # overlay id + entry table and data, reached by global symbol
      # Original files, from jump-table alignment (tools/jtbl_classes.py): GCC aligns tables to 8 relative
      # to its object's rodata, so all tables of one file share an address mod 8, and each unit's rodata
      # starts at its first table. field then field_b (code cut at 0x800DE3B8; rodata at 0x800B6E4C, 0x800B9AA0).
      - [0x5C, .rodata, field] # 0x800B6E4C
      - [0x2CB0, .rodata, field_b]
      - [0x3A10, cpp, field]
      - [0x275C8, cpp, field_b]
      - [0x332B8, data]

  - [0x33AB0]
