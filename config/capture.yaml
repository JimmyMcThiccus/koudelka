name: CAPTURE.BIN
sha1: df5a2b5465a645bc78a7b13173bf3aee428edbad
options:
  basename: capture
  target_path: extracted/disc1/BIN/CAPTURE.BIN
  elf_path: build/capture.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/capture
  src_path: src/capture
  build_path: build
  ld_script_path: build/linkers/capture.ld
  symbol_addrs_path:
    - config/symbols/main.txt
    - config/symbols/main_a.txt
    - config/symbols/main_a2.txt
    - config/symbols/main_b.txt
    - config/symbols/sound.txt
    - config/symbols/capture.txt
  undefined_funcs_auto_path: build/linkers/undefined_funcs_auto.capture.txt
  undefined_syms_auto_path: build/linkers/undefined_syms_auto.capture.txt

  find_file_boundaries: true
  gp_value: 0x800B4BFC
  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  use_legacy_include_asm: false
  asm_jtbl_label_macro: jlabel
  create_c_files: true # only creates missing files; never overwrites src/
  auto_decompile_empty_functions: false # keep them INCLUDE_ASM: a .cpp body would mangle the name
  disassemble_all: true # decompiled functions keep a reference .s in asm/<target>/matchings/
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  subalign: 4
  ld_align_section_vram_end: false
  ld_align_segment_vram_end: false

segments:
  - name: capture
    type: code
    start: 0x0
    vram: 0x800B6DF0
    subsegments:
      - [0x0, rodata] # overlay id + entry table and data, reached by global symbol
      # capture_b.cpp's rodata starts at its jump table (4 mod 8, func_800BE204's): GCC aligns tables to 8
      # relative to the object's rodata (tools/jtbl_classes.py)
      - [0x50C, .rodata, capture_b] # 0x800B72FC
      # 0x800B758C-0x800B85B4: GCC 2.7.2 / PsyQ 4.1 (see config/toolchain.toml). Every function here with a stack
      # frame ends `addiu $sp; jr $ra; nop` (the 2.7.2 epilogue, delay slot unfilled), and only these in all
      # overlays do; func_800B76E4 matches byte-for-byte under 4.1 and not under 4.4. The file has no rodata.
      - [0x79C, cpp, capture] # 0x800B758C
      # 0x800B85B8 on: PsyQ 4.4 (GCC 2.8.1) like the rest of the game code
      - [0x17C8, cpp, capture_b] # 0x800B85B8
      - [0xC3EC, data]

  - [0xC42C]
