# Koudelka toolchain. Archives are fetched into bin/dl/<name>/ and unpacked into bin/.

[compiler]
# Game code: GCC 2.8.x, PsyQ 4.3 (2.8.0) or 4.4 (2.8.1). Every test so far gives identical output
# from both; 4.4 is the pick. Reproduced exactly: func_800186E8 (C++ virtual call in a loop) and
# func_8006F630 (switch with jump table). PsyQ 4.1 (2.7.2), 4.5 (egcs 2.91) and 4.6 (2.95.2) all
# differ on both. (The SDK libraries linked into the EXE are PsyQ 4.6; the compiler is older.)
psyq = "bin/psyq4.4"
cc1 = "CC1PSX.EXE"        # C: GCC 2.8.1 SN32 BUILD 4.0.0010
cc1plus = "CC1PLPSX.EXE"  # C++
aspsx = "2.79"            # maspsx --aspsx-version; the tests don't constrain it, so 4.4's own ASPSX
cflags = "-O2 -G8"        # $gp is used for statics (func_800186E8); some files reach globals with lui (-G0, or large objects)

[compiler.overrides]
# "src/<path>" = "<cflags>", or { cflags = "...", as_G = N } when the assembler's -G differs.
# Overlays: the compiler ran with -G8 but the assembler never used $gp (0 gp-relative accesses in all six;
# the EXE has 391). The CAPTURE session found the evidence: func_800B9E10 loads a 4-byte EXE global as
# `lui $s0; lw $s0`, which is the assembler expanding GCC's `lw $16,sym` macro. With -G0, GCC splits the
# address itself and picks $v0 as the temporary.
"src/field/field.cpp" = { cflags = "-O2 -G8", as_G = 0 }
"src/battle/battle.cpp" = { cflags = "-O2 -G8", as_G = 0 }
"src/movie/movie.cpp" = { cflags = "-O2 -G8", as_G = 0 }
"src/capture/capture.cpp" = { cflags = "-O2 -G8", as_G = 0 }
"src/gameend/gameend.cpp" = { cflags = "-O2 -G8", as_G = 0 }
"src/effect/effect.cpp" = { cflags = "-O2 -G8", as_G = 0 }

[maspsx]
